<fieldset ng-controller="NewshubSearchController as searchPanel">

    <div class="field">
        <label for="search-headline">{{:: 'Urgency' | translate}}</label>
        <div class="control">
            <input type="text" id="search-urgency" ng-model="params.urgency" tabindex="1">
        </div>
    </div>
    <div class="field">
        <label for="search-genre">{{:: 'Genre' | translate}}</label>
        <div class="control">
            <input type="text" id="search-genre" ng-model="params.genre" tabindex="2">
        </div>
    </div>

    <div class="field">
        <label class="search-label" translate>{{:: 'Period' | translate}}</label>
        <select ng-model="params.period">
            <option ng-repeat="period in searchPanel.periods" value="{{ period.id }}">{{ period.name }}</option>
        </select>
    </div>
    <!-- add subjects -->
    <div class="field">
        <label class="search-label" translate>{{:: 'Subjects' | translate}}</label>
        <select ng-model="params.subject">
            <option ng-repeat="subject in searchPanel.subjects.items" value="{{ subject.qcode }}">{{ subject.name }}</option>
        </select>
    </div>
    <div class="form__row form__row--flex form__row--small-padding">
        <div class="form__row-item">
            <label class="form-label" translate>{{:: 'From' | translate}}</label>
            <div sd-datepicker
                ng-model="params.dates.start"
                data-on-change="onDatesChange()"
            ></div>
        </div>
        <div class="form__row-item">
            <label class="form-label" translate>{{:: 'To' | translate}}</label>
            <div sd-datepicker
                ng-model="params.dates.end"
                data-on-change="onDatesChange()"
            ></div>
        </div>
    </div>
</fieldset>
